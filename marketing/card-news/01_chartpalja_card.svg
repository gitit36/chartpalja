  <text x="188" y="1245" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="600" fill="#F7F7FA" text-anchor="start" opacity="1">왜 한 사람당 2개 넘게 만들었을까?</text>
  <text x="955" y="1246" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="600" fill="#FFE64A" text-anchor="end" opacity="1">→</text>
  <text x="70" y="1320" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="600" fill="#A3A3B2" text-anchor="start" opacity="1">차트팔자  ·  사주팔자, 차트로 읽다</text>
