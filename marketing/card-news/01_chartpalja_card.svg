  <rect x="570" y="830" width="18" height="120" rx="7" fill="#4B82EF" opacity="0.65"/><rect x="597" y="765" width="18" height="185" rx="7" fill="#F04452" opacity="0.73"/><rect x="624" y="805" width="18" height="145" rx="7" fill="#F04452" opacity="0.81"/><rect x="651" y="710" width="18" height="240" rx="7" fill="#4B82EF" opacity="0.89"/><rect x="678" y="770" width="18" height="180" rx="7" fill="#F04452" opacity="0.65"/><rect x="705" y="650" width="18" height="300" rx="7" fill="#F04452" opacity="0.73"/><rect x="732" y="732" width="18" height="218" rx="7" fill="#4B82EF" opacity="0.81"/><rect x="759" y="600" width="18" height="350" rx="7" fill="#F04452" opacity="0.89"/><rect x="786" y="675" width="18" height="275" rx="7" fill="#F04452" opacity="0.65"/><rect x="813" y="560" width="18" height="390" rx="7" fill="#4B82EF" opacity="0.73"/><rect x="840" y="640" width="18" height="310" rx="7" fill="#F04452" opacity="0.81"/><rect x="867" y="520" width="18" height="430" rx="7" fill="#F04452" opacity="0.89"/><rect x="894" y="580" width="18" height="370" rx="7" fill="#4B82EF" opacity="0.65"/><rect x="921" y="480" width="18" height="470" rx="7" fill="#F04452" opacity="0.73"/>
  <text x="540" y="1038" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="600" fill="#F7F7FA" text-anchor="middle" opacity="1">한 사람이 평균 2개 이상의 차트를 열어봤어요</text>

  <rect x="70" y="1188" width="940" height="92" rx="28" fill="#20202A" stroke="#343442"/>
