  <rect x="104" y="70" width="24" height="6" rx="3" fill="#393944"/><rect x="138" y="70" width="24" height="6" rx="3" fill="#393944"/><rect x="172" y="70" width="24" height="6" rx="3" fill="#393944"/><rect x="206" y="70" width="24" height="6" rx="3" fill="#393944"/><rect x="240" y="70" width="24" height="6" rx="3" fill="#393944"/><rect x="274" y="70" width="24" height="6" rx="3" fill="#393944"/><rect x="308" y="70" width="24" height="6" rx="3" fill="#393944"/>
  <text x="1010" y="79" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#A3A3B2" text-anchor="end" opacity="1">1/7</text>
  <text x="70" y="142" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="700" fill="#FFE64A" text-anchor="start" opacity="1">LAUNCH DAY 01</text>
  <text x="70" y="215" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="58" font-weight="800" fill="#F7F7FA"><tspan x="70" dy="0">하루 만에,</tspan><tspan x="70" dy="72">이만큼 열어봤습니다</tspan></text>
  <text x="70" y="390" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="500" fill="#A3A3B2" text-anchor="start" opacity="1">무료 이용자를 포함한 실제 사주 입력 기준</text>
  
  <rect x="70" y="455" width="940" height="635" rx="44" fill="url(#redGlow)" stroke="#3A3546"/>
  <text x="120" y="575" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="650" fill="#A3A3B2" text-anchor="start" opacity="1">출시 하루 만에</text>
  <text x="120" y="735" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="138" font-weight="850" fill="#F7F7FA" text-anchor="start" opacity="1">133</text>
